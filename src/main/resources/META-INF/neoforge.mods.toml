modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="logo.png"
updateJSONURL="https://github.com/csmd19198/FakeTimeMod/releases/latest/download/update.json"
displayURL="https://github.com/csmd19198/FakeTimeMod"
issueTrackerURL="https://github.com/csmd19198/FakeTimeMod/issues"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

# NeoForge 21.1 (FML 4): mixin configs are registered via [[mixins]] in neoforge.mods.toml
# (ModFileParser.getMixinConfigs). ModDevGradle dev runs do NOT add --mixin.config launch args
# (ForgeGradle did), so without this the 6 mixins would silently not be applied in dev.
[[mixins]]
config = "faketimemod.mixins.json"
