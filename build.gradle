plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = property('mod_version')
group = property('mod_group_id')
base { archivesName = property('mod_id') }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

minecraft {
    mappings channel: property('mapping_channel'), version: property('mapping_version')
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { faketimemod { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { faketimemod { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'faketimemod.refmap.json'
    config 'faketimemod.mixins.json'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test { useJUnitPlatform() }

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand project.properties
    }
    // Dev runs (Forge 52 modular loader): FML's ClasspathLocator builds the mod file from
    // the classpath entry that contains META-INF/mods.toml. With separate output dirs
    // (build/resources/main vs build/classes/java/main) it would pick the resources dir,
    // which has no classes -> "constructed 0 mods". Keep mods.toml out of the loose
    // resources output; the expanded copy is placed into the classes output instead
    // (copyModsTomlToClasses), so the dev mod file carries both classes and mods.toml.
    exclude 'META-INF/mods.toml'
}

tasks.register('copyModsTomlToClasses') {
    dependsOn 'processResources'
    def outDir = layout.buildDirectory.dir('classes/java/main/META-INF')
    outputs.dir(outDir)
    doLast {
        copy {
            from 'src/main/resources/META-INF/mods.toml'
            into outDir
            expand project.properties
        }
    }
}

// The dev runs must see the classes dir as the mod file, so ensure mods.toml is there first.
// The packaged jar also needs mods.toml, which now lives in the classes output (not resources).
tasks.matching { it.name in ['prepareRunClient', 'prepareRunServer', 'jar'] }.configureEach {
    dependsOn 'copyModsTomlToClasses'
}
