plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = property('mod_version')
group = property('mod_group_id')
base { archivesName = property('mod_id') }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = property('neo_version')
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        faketimemod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test { useJUnitPlatform() }

processResources {
    // Dev runs (NeoForge 21.1 modular loader): FML's ClasspathLocator builds the mod file from the
    // classpath entry that contains META-INF/neoforge.mods.toml, and the mod's resource pack (lang
    // etc.) is loaded from that same entry. So neoforge.mods.toml + assets + pack.mcmeta must live
    // in the classes output (see copyResourcesToClasses) to make build/classes/java/main a
    // self-contained mod file. Keep them out of the loose resources output to avoid
    // duplicate entries in the packaged jar. faketimemod.mixins.json stays in resources
    // (loaded from the classpath via the --mixin.config launch arg).
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'assets/**'
    exclude 'pack.mcmeta'
    var replaceProperties = [
            minecraft_version: project.property('minecraft_version'),
            minecraft_version_range: project.property('minecraft_version_range'),
            neo_version: project.property('neo_version'),
            neo_version_range: project.property('neo_version_range'),
            loader_version_range: project.property('loader_version_range'),
            mod_id: project.property('mod_id'),
            mod_name: project.property('mod_name'),
            mod_license: project.property('mod_license'),
            mod_version: project.property('mod_version'),
            mod_authors: project.property('mod_authors'),
            mod_description: project.property('mod_description'),
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.register('copyResourcesToClasses') {
    dependsOn 'processResources', 'compileJava'
    inputs.files 'src/main/resources'
    inputs.property 'version', project.version
    def outDir = layout.buildDirectory.dir('classes/java/main')
    outputs.dir(outDir)
    doLast {
        copy {
            from 'src/main/resources'
            into outDir
            exclude 'faketimemod.mixins.json'
            // 只对 neoforge.mods.toml 做变量展开，其余资源（lang、二进制纹理等）原样复制
            filesMatching('META-INF/neoforge.mods.toml') {
                expand project.properties
            }
        }
        // Mixin 注解处理器把 refmap 生成到 build/tmp/compileJava，需一并放进运行时类路径，
        // 否则 dev 环境每次启动报 "Reference map ... could not be read" 警告。
        def refmap = layout.buildDirectory.file('tmp/compileJava/faketimemod.refmap.json')
        if (refmap.get().asFile.exists()) {
            copy {
                from refmap
                into outDir
            }
        }
    }
}

// The dev runs must see the classes dir as the mod file, so ensure resources are there first.
// The packaged jar also needs them, now living in the classes output (not the loose resources).
// compileTestJava 也消费 build/classes/java/main（测试类路径含主输出），需显式声明依赖，
// 否则 Gradle 校验报隐式依赖问题。
tasks.matching { it.name in ['prepareRunClient', 'prepareRunServer', 'runClient', 'runServer', 'jar', 'compileTestJava'] }.configureEach {
    dependsOn 'copyResourcesToClasses'
}
