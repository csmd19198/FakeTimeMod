plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = property('mod_version')
group = property('mod_group_id')
base { archivesName = property('mod_id') }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = property('neo_version')
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        faketimemod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // NeoForge 21.1 无 SRG 层（dev/生产同为官方名），而 mixin AP (MCP env) 校验
    // @Inject/@Redirect/@Shadow 目标必须要有映射文件，否则报 "Unable to locate obfuscation
    // mapping"。gradle/faketimemod-identity.srg 提供恒等映射（official→official）：
    // 校验通过且 refmap 内容恒等无害（运行时本来就不做重映射）。
    // 新增 mixin 目标时需在 gradle/faketimemod-identity.srg 补充对应 CL/MD/FD 条目。
    options.compilerArgs += [
            '-AreobfSrgFile=' + file('gradle/faketimemod-identity.srg'),
            '-AoutRefMapFile=' + layout.buildDirectory.file('tmp/compileJava/faketimemod.refmap.json').get().asFile
    ]
}

test { useJUnitPlatform() }

processResources {
    // NeoForge 21.1 dev (ModDevGradle): the mod's folders (build/classes/java/main +
    // build/resources/main) are passed to FML via -Dfml.modFolders, and FML's
    // UserdevLocator/ModFile build one mod file spanning both paths, reading
    // META-INF/neoforge.mods.toml and the resource pack from them. So the normal
    // processResources output (toml + assets + pack.mcmeta in build/resources/main)
    // is already a self-contained mod file for dev runs and for the packaged jar —
    // no fold-into-classes copyResourcesToClasses workspace needed (removed with
    // the Forge 52 dev-resource folding).
    var replaceProperties = [
            minecraft_version: project.property('minecraft_version'),
            minecraft_version_range: project.property('minecraft_version_range'),
            neo_version: project.property('neo_version'),
            neo_version_range: project.property('neo_version_range'),
            loader_version_range: project.property('loader_version_range'),
            mod_id: project.property('mod_id'),
            mod_name: project.property('mod_name'),
            mod_license: project.property('mod_license'),
            mod_version: project.property('mod_version'),
            mod_authors: project.property('mod_authors'),
            mod_description: project.property('mod_description'),
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
